<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Hooks Tester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="topbar">
      <div>
        <div class="brand">DISCORD WEBHOOKS</div>
        <div class="subtitle">Webhook testing dashboard</div>
      </div>
      <span id="status" class="badge" data-state="idle">Ready</span>
    </header>

    <section class="card">
      <h2>Webhook Configuration</h2>

      <label for="webhook">Webhook URL</label>
      <input id="webhook" type="password"
        placeholder="https://discord.com/api/webhooks/..."
        autocomplete="off" spellcheck="false">

      <label for="message">Message</label>
      <textarea id="message" rows="4"
        placeholder="Tulis pesan pengujian..."></textarea>

      <div class="settings-grid">
        <div>
          <label for="count">Message Count</label>
          <input id="count" type="number" min="1" max="1000000" value="1">
          <p class="hint">Maximum messages per batch.</p>
        </div>
        <div>
          <label for="interval">Message Delay (Seconds)</label>
          <input id="interval" type="number" min="0.1" max="60" step="0.1" value="0.1">
          <p class="hint">0.1 to 60 seconds.</p>
        </div>
      </div>

      <div class="button-row" style="margin-top: 20px;">
        <button id="startBtn" class="main-btn">Start Test</button>
        <button id="stopBtn" class="stop-btn" disabled>Stop</button>
      </div>
    </section>

    <section class="card">
      <div class="log-heading">
        <div>
          <h2>Activity Log</h2>
          <div class="subtitle">Records of successful and failed messages.</div>
        </div>
        <button id="clearBtn" class="soft-btn clear">Clear Logs</button>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <span id="statTotal" class="stat-num">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-box success">
          <span id="statSuccess" class="stat-num">0</span>
          <span class="stat-label">Success</span>
        </div>
        <div class="stat-box failed">
          <span id="statFailed" class="stat-num">0</span>
          <span class="stat-label">Failed</span>
        </div>
      </div>

      <div class="progress-info">
        <span id="progressText">Belum ada pengiriman</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div id="progressBar" class="progress-fill"></div>
      </div>

      <div id="logs" class="logs" role="log" aria-live="polite">
        <div class="empty-log">Belum ada aktivitas.</div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
