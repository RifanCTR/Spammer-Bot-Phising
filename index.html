<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Tools Directory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="/" class="logo">FAN<span>TOOLS</span></a>
        <div class="nav-label">DIRECTORY</div>
    </header>

    <main class="container">

        <section class="hero">
            <h1>All your tools.<br><span>One place.</span></h1>
        </section>

        <section class="tools-section">
            <div class="tools-grid">

                <a href="/Public/Telegram/" class="tool-card">
                    <div class="card-top">
                        <div class="tool-icon">
                        <img src="Telegram.png" alt="Telegram" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
                            <span class="fallback-icon" style="display:none;">T</span>
                        </div>
                        <span class="arrow">↗</span>
                    </div>

                    <div class="card-info">
                        <h3>Telegram BotApi</h3>
                        <p>Uji dan kelola pengiriman pesan Telegram Bot.</p>
                    </div>
                </a>

                <a href="http://localhost:3000/" class="tool-card">
                    <div class="card-top">
                        <div class="tool-icon">
                        <img src="Discord.png" alt="Discord" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
                        <span class="fallback-icon" style="display:none;">D</span>
                        </div>
                        <span class="arrow">↗</span>
                    </div>

                    <div class="card-info">
                        <h3>Discord BotApi</h3>
                        <p>Dashboard pengujian koneksi bot dan pesan Discord.</p>
                    </div>
                </a>
                <a href="http://localhost:3001/" class="tool-card">
                        <div class="card-top">
                        <div class="tool-icon">
                        <img src="Discord.png" alt="Discord Hooks" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
                     <span class="fallback-icon" style="display:none;">H</span>
                </div>
                    <span class="arrow">↗</span>
                </div>
                        <div class="card-info">
                        <h3>Discord WebHooks</h3>
                        <p>Pengujian Discord Webhook melalui URL dan pesan.</p>
                </div>
                </a>
            </div>
        </section>
        <footer>
            <span>FAN TOOLS</span>
            <span>2026</span>
        </footer>

    </main>
    <script src="script.js"></script>
</body>
</html>
